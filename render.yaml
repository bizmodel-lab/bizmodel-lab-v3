services:
  - type: web
    name: bizmodel-lab-v3
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        value: 发布时在 Render 控制台填写外部 Postgres 连接串（Neon/Supabase 免费实例）