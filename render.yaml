services:
  - type: web
    name: bizmodel-lab-v3
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bizmodel-data
      mountPath: /var/data
      sizeGB: 1